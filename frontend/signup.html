<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AI Offer Letter Verifier</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-shield-alt"></i>
        </div>
        <h1>Create Account</h1>
        <p>Join us to verify offer letters</p>
      </div>

      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="fullName">
            <i class="fas fa-user"></i> Full Name
          </label>
          <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i> Email Address
          </label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i> Password
          </label>
          <input type="password" id="password" name="password" placeholder="Create a password (min 6 characters)" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">
            <i class="fas fa-lock"></i> Confirm Password
          </label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="successMessage" class="success-message" style="display: none;"></div>

        <button type="submit" class="btn auth-btn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>

        <div class="auth-loader" id="authLoader" style="display: none;">
          <div class="spinner"></div>
          <p>Creating account...</p>
        </div>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html" class="auth-link">Login here</a></p>
      </div>

      <div class="auth-back">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const authLoader = document.getElementById('authLoader');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      // Hide previous messages
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      // Validate passwords match
      if (password !== confirmPassword) {
        errorMessage.textContent = 'Passwords do not match!';
        errorMessage.style.display = 'block';
        return;
      }

      // Validate password length
      if (password.length < 6) {
        errorMessage.textContent = 'Password must be at least 6 characters!';
        errorMessage.style.display = 'block';
        return;
      }

      // Validate email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        errorMessage.textContent = 'Please enter a valid email address!';
        errorMessage.style.display = 'block';
        return;
      }

      // Show loader
      authLoader.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const response = await fetch('http://localhost:5000/api/auth/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ fullName, email, password })
        });

        const data = await response.json();

        if (data.success) {
          successMessage.textContent = 'Account created successfully! Redirecting to login...';
          successMessage.style.display = 'block';
          
          // Redirect to login after 2 seconds
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          errorMessage.textContent = data.error || 'Registration failed. Please try again.';
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        console.error('Signup error:', error);
        errorMessage.textContent = 'Unable to connect to server. Please make sure the backend is running.';
        errorMessage.style.display = 'block';
      } finally {
        authLoader.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
